    <h1>Gomu Gomu no Jet Gigant</h1>
    <p>
      Prévia no motor do jogo. Em combate livre, pressione R com a barra
      completa para tentar o Jet Pistol.
    </p>
    <div class="controls">
      <label
        >Ensaio
        <select id="scenario">
          <option value="hit">Acerto</option>
          <option value="ko">KO</option>
          <option value="guard">Defesa</option>
          <option value="whiff">Fora de alcance</option>
          <option value="empty">Sem barra</option>
          <option value="free">Combate livre</option>
        </select></label
      >
      <label
        >Adversário
        <select id="rival">
          <option value="samurai">Samurai</option>
          <option value="dio">Dio</option>
          <option value="goku">Goku</option>
          <option value="luffy">Luffy</option>
        </select></label
      >
      <label
        >Velocidade
        <select id="speed">
          <option value="0.25">¼×</option>
          <option value="0.5">½×</option>
          <option value="1" selected>1×</option>
        </select></label
      >
      <label><input type="checkbox" id="mirror" /> Espelhar</label>
      <label><input type="checkbox" id="debug" /> Caixas</label>
      <button id="reset">Repetir</button><button id="play">Pausar</button>
      <button id="step">Avançar um tick</button>
    </div>
    <canvas id="arena" width="1280" height="720" tabindex="0"></canvas>
    <div class="controls">
      <label for="seek">Linha do tempo</label
      ><input id="seek" type="range" min="0" max="540" value="0" />
      <output id="status" aria-live="off">Carregando sprites…</output>
    </div>
    <p>
      <a href="../sprites/luffy/jet/body.png">Corpo</a> ·
